<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="880" height="430" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="28" y="40" font-size="19" font-weight="700" fill="#1f2328">The speculative-decoding knob peaks in OPPOSITE places per model</text>
  <text x="28" y="63" font-size="13" fill="#57606a">spec_min_p sweep (windows open only while the drafter's confidence clears the bar) · warm-cache sweep, medians</text>

  <!-- plot area: x 90..820 (spec_min_p 0.05..1.05), y 90..330 (55..100 tok/s) -->
  <!-- gridlines: y for 60,70,80,90 -->
  <g stroke="#eaeef2">
    <line x1="90" y1="303.4" x2="820" y2="303.4"/>
    <line x1="90" y1="255.6" x2="820" y2="255.6"/>
    <line x1="90" y1="207.8" x2="820" y2="207.8"/>
    <line x1="90" y1="160.0" x2="820" y2="160.0"/>
  </g>
  <g font-size="11" fill="#8c959f" text-anchor="end">
    <text x="82" y="307">60</text><text x="82" y="259">70</text><text x="82" y="212">80</text><text x="82" y="164">90</text>
  </g>

  <!-- x scale: p 0.05..1.05 -> 90..820 ; x = 90 + (p-0.05)*730 -->
  <!-- IQ3_XXS polyline (0.10..1.00) -->
  <!-- pts: 0.10:66.8, 0.20:60.4, 0.25:72.6, 0.30:73.2, 0.40:76.4, 0.45:79.4, 0.50:78.4, 0.60:82.5, 0.70:83.6, 0.80:77.0, 0.90:79.7, 1.00:63.7 -->
  <!-- y = 351 - (v-55)*4.78  => 66.8:292.4  60.4:322.9  72.6:264.6  73.2:261.7  76.4:246.4  79.4:232.1  78.4:236.9  82.5:217.3  83.6:212.0  77.0:244.5  79.7:231.6  63.7:308.1 -->
  <!-- x: 0.10:126.5  0.20:199.5  0.25:236  0.30:272.5  0.40:345.5  0.45:382  0.50:418.5  0.60:491.5  0.70:564.5  0.80:637.5  0.90:710.5  1.00:783.5 -->
  <polyline fill="none" stroke="#8250df" stroke-width="3"
    points="126.5,292.4 199.5,322.9 236,264.6 272.5,261.7 345.5,246.4 382,232.1 418.5,236.9 491.5,217.3 564.5,212.0 637.5,244.5 710.5,231.6 783.5,308.1"/>
  <g fill="#8250df">
    <circle cx="126.5" cy="292.4" r="4"/><circle cx="199.5" cy="322.9" r="4"/><circle cx="236" cy="264.6" r="4"/>
    <circle cx="272.5" cy="261.7" r="4"/><circle cx="345.5" cy="246.4" r="4"/><circle cx="382" cy="232.1" r="4"/>
    <circle cx="418.5" cy="236.9" r="4"/><circle cx="491.5" cy="217.3" r="4"/><circle cx="637.5" cy="244.5" r="4"/>
    <circle cx="710.5" cy="231.6" r="4"/><circle cx="783.5" cy="308.1" r="4"/>
  </g>
  <!-- IQ3 peak marker -->
  <circle cx="564.5" cy="212.0" r="7" fill="none" stroke="#8250df" stroke-width="2.5"/>
  <text x="564.5" y="196" font-size="13.5" font-weight="800" fill="#6e40c9" text-anchor="middle">IQ3_XXS peak @ 0.70 · 83.6</text>

  <!-- Q2_0 polyline (0.30:93.5, 0.50:90.1, 0.70:87.2) -->
  <!-- y: 93.5:121.7  90.1:137.9  87.2:151.8 -->
  <polyline fill="none" stroke="#2da44e" stroke-width="3" points="272.5,121.7 418.5,137.9 564.5,151.8"/>
  <g fill="#2da44e">
    <circle cx="272.5" cy="121.7" r="4"/><circle cx="418.5" cy="137.9" r="4"/><circle cx="564.5" cy="151.8" r="4"/>
  </g>
  <!-- Q2_0 peak marker -->
  <circle cx="272.5" cy="121.7" r="7" fill="none" stroke="#2da44e" stroke-width="2.5"/>
  <text x="272.5" y="105" font-size="13.5" font-weight="800" fill="#1a7f37" text-anchor="middle">Q2_0 peak @ 0.30 · 93.5</text>

  <!-- x axis labels -->
  <g font-size="11" fill="#8c959f" text-anchor="middle">
    <text x="126.5" y="348">0.1</text><text x="236" y="348">0.25</text><text x="345.5" y="348">0.4</text>
    <text x="418.5" y="348">0.5</text><text x="564.5" y="348">0.7</text><text x="710.5" y="348">0.9</text><text x="783.5" y="348">1.0</text>
    <text x="455" y="372" fill="#57606a">spec_min_p</text>
  </g>

  <text x="28" y="404" font-size="12.5" fill="#57606a">Same knob, opposite optima: the better the drafter, the higher the bar it can afford. Re-sweep on every model change — reusing another model's peak costs 10-15%.</text>
  <text x="28" y="421" font-size="11.5" fill="#8c959f">IQ3_XXS acceptance at its peak: 70.8% (143/202). MTP off (1.00) vs on: 63.7 vs 74.4 = +16.8%.</text>
</svg>
