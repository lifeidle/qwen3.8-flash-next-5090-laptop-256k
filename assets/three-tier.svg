<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img">
<title>three-tier memory split</title><desc>what goes to SSD / RAM / VRAM and why</desc>
<rect width="860" height="430" fill="#ffffff"/>
<text x="40" y="34" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Qwen3.8-Flash-Next 的三层内存分配（ncmoe=42 · ctx=262144 · AD-4.27bpw）</text>
<text x="40" y="54" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#656d76" font-weight="400" text-anchor="start">按访问模式分配：每 token 只读 KB 级 → SSD；只读 2% → 内存；全读 → 显存</text>
<rect x="40" y="76" width="780" height="100" rx="10" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5"/>
<rect x="40" y="76" width="6" height="100" rx="3" fill="#8250df"/>
<text x="62" y="102" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8250df" font-weight="500" text-anchor="start">固态 SSD</text>
<text x="250" y="102" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#656d76" font-weight="400" text-anchor="start">88.03 GiB 模型文件</text>
<text x="62" y="126" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">· N-gram 表 35.76 GiB（51.2B 参数）</text>
<text x="62" y="146" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">· 每 token 只查 16 行 ≈ 几 KB，冷页按需读入</text>
<text x="800" y="162" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76" font-weight="400" text-anchor="end">mmap 按需分页 · 几乎零成本</text>
<rect x="40" y="190" width="780" height="100" rx="10" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5"/>
<rect x="40" y="190" width="6" height="100" rx="3" fill="#bf8700"/>
<text x="62" y="216" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#bf8700" font-weight="500" text-anchor="start">系统内存 RAM · 64 GB</text>
<text x="250" y="216" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#656d76" font-weight="400" text-anchor="start">映射工作集 79 GiB（比值 1.23，实测稳定）</text>
<text x="62" y="240" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">· 42 层专家权重 ≈ 43.3 GiB（每 token 激活 10/512）</text>
<text x="62" y="260" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">· 表的页缓存（可回收）</text>
<text x="800" y="276" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76" font-weight="400" text-anchor="end">内存峰值实测 94~96%</text>
<rect x="40" y="304" width="780" height="100" rx="10" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5"/>
<rect x="40" y="304" width="6" height="100" rx="3" fill="#1a7f37"/>
<text x="62" y="330" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1a7f37" font-weight="500" text-anchor="start">显存 VRAM · 24 GB</text>
<text x="250" y="330" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#656d76" font-weight="400" text-anchor="start">占用 20.9 GiB</text>
<text x="62" y="354" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">· 6 层专家 6.18 + 注意力等常驻 4.4 GiB</text>
<text x="62" y="374" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">· KV 缓存 8.25 GiB（256K 全长）</text>
<text x="62" y="394" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">· 计算缓冲 1.98 + 循环态 0.11 GiB</text>
<text x="800" y="390" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76" font-weight="400" text-anchor="end">留 1.5 GiB 以上余量</text>
</svg>